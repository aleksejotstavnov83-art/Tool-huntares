plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'com.huntares.tool'
    buildTypes {
        debug { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
        release { minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileSdk 35
    defaultConfig { applicationId 'com.huntares.tool'; minSdk 26; targetSdk 28; ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }; versionCode 3; versionName '1.2-offline' }
}
chaquopy { defaultConfig { version '3.11' } }
dependencies { implementation 'androidx.documentfile:documentfile:1.0.1' }
